<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manga Translation</title>
<!-- Theme: 4chan "Tomorrow" (colors taken from s.4cdn.org/css/tomorrow.css) -->
<style>
  * { box-sizing: border-box; }
  body {
    background: #1d1f21 none; color: #c5c8c6;
    font-family: arial, helvetica, sans-serif; font-size: 10pt;
    margin: 5px 8px 30px; padding-left: 5px; padding-right: 5px;
  }
  a, a:visited { color: #81a2be; text-decoration: none; }
  a:hover { color: #5F89AC; }
  hr { border: none; border-top: 1px solid #282a2e; height: 0; }

  #nav { font-size: 9pt; text-align: right; }

  .boardBanner { text-align: center; clear: both; margin: 10px 0 6px; }
  .boardTitle { font-family: Tahoma, sans-serif; font-size: 28px; font-weight: bold;
                letter-spacing: -2px; }
  .boardSubtitle { font-size: 9pt; }

  .container { max-width: 1000px; margin: 0 auto; }

  fieldset.postform, fieldset.adv {
    background: #282a2e; border: 1px solid #282a2e; padding: 8px 10px; margin: 12px 0;
  }
  fieldset.adv { margin: 10px 0 6px; }
  fieldset.postform > legend, fieldset.adv > legend { color: #b294bb; font-weight: bold; padding: 0 4px; }

  input[type=text], input[type=number], textarea, select {
    background: #1d1f21; color: #c5c8c6; border: 1px solid #3a3d42;
    padding: 3px 4px; font-family: inherit; font-size: 10pt;
  }
  textarea { width: 100%; resize: vertical; }

  .dropzone {
    border: 2px dashed #3a3d42; padding: 16px; text-align: center;
    color: #8abeb7; cursor: pointer; margin-bottom: 6px;
  }
  .dropzone:hover, .dropzone.drag { border-color: #81a2be; color: #81a2be; }
  .dropzone kbd { background: #1d1f21; border: 1px solid #3a3d42; border-bottom-width: 2px;
                  padding: 0 4px; font-family: inherit; font-size: 9pt; color: #c5c8c6; }
  #file-input { display: none; }

  /* -------- upload queue (thumbnails) -------- */
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
            gap: 8px; margin: 8px 0 4px; }
  .thumb { position: relative; background: #1d1f21; border: 1px solid #3a3d42;
           padding: 4px; display: flex; flex-direction: column; gap: 3px; }
  .thumb.dragover { border-color: #81a2be; }
  .thumb .pic { width: 100%; height: 92px; object-fit: contain; background: #16181a; display: block; }
  .thumb .num { position: absolute; top: 7px; left: 7px; background: #81a2be; color: #1d1f21;
                font-size: 8pt; font-weight: bold; padding: 0 5px; }
  .thumb .fname { font-size: 8.5pt; color: #8abeb7; white-space: nowrap;
                  overflow: hidden; text-overflow: ellipsis; }
  .thumb .fmeta { font-size: 8pt; color: #969896; display: flex; justify-content: space-between; }
  .thumb .fctl { display: flex; gap: 4px; }
  .thumb .fctl button { flex: 1; padding: 3px 0; font-size: 9.5pt; line-height: 1.3; }
  .thumb .fctl button.rm { flex: 0 0 34px; }

  ::placeholder { color: #6b6f74; }
  :focus-visible { outline: 1px solid #81a2be; outline-offset: 1px; }
  .advgrid label.check { cursor: pointer; }
  .advgrid small.note { font-size: 8.5pt; color: #969896; }

  @media (max-width: 640px) { .advgrid { grid-template-columns: 1fr; } }

  .advgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 18px; margin-top: 8px; }
  .advgrid label { display: flex; flex-direction: column; gap: 2px; font-size: 9.5pt; }
  .advgrid label.check { flex-direction: row; align-items: center; gap: 6px; }
  .advgrid .full { grid-column: 1 / -1; }

  button {
    background: #3a3d42; color: #c5c8c6; border: 1px solid #111;
    padding: 4px 14px; cursor: pointer; font-family: inherit; font-size: 10pt;
  }
  button:hover:enabled { background: #81a2be; color: #1d1f21; }
  button:disabled { opacity: .5; cursor: default; }

  .st { font-weight: bold; font-size: 8pt; }
  .st.queued { color: #585858; }
  .st.processing { color: #f0c674; }
  .st.done { color: #b5bd68; }
  .st.error { color: #cc6666; }
  .err { color: #cc6666; }
  .note { color: #8abeb7; font-size: 9pt; }

  #results { margin-top: 14px; }
  .reply { background: #282a2e; border: 1px solid #282a2e;
           padding: 4px 8px 8px; margin: 8px 0; display: table; }
  .postInfo { font-size: 10pt; margin-bottom: 4px; }
  .postInfo .name { font-weight: bold; }
  .postInfo .subject { color: #b294bb; font-weight: bold; }
  .fileText { font-size: 9pt; margin: 2px 0 4px; }
  .fileText a { text-decoration: underline; }
  .reply img.result { max-width: 100%; display: block; margin: 4px 0; }
  .dl { margin-top: 6px; font-size: 9pt; }
  .dl a { margin-right: 12px; text-decoration: underline; }
</style>
</head>
<body>

<div id="nav">
  <a href="https://github.com/ArsVie/Multi-Modal-Manga-Translation-Pipeline">GitHub</a>
</div>

<div class="boardBanner">
  <div class="boardTitle">Manga Translation</div>
  <div class="boardSubtitle">Japanese-&gt;English — powered by Gemma-tan ♡ (◕ᴗ◕✿)</div>
</div>

<hr>

<div class="container">

  <fieldset class="postform">
    <legend>Start a translation</legend>

    <div class="dropzone" id="dropzone">Drop pages here, click to browse, or paste with <kbd>Ctrl</kbd>+<kbd>V</kbd> — PNG / JPG / WEBP</div>
    <input type="file" id="file-input" multiple accept="image/jpeg,image/png,image/webp,image/bmp">
    <div class="note" id="queue-note"></div>
    <div class="thumbs" id="thumbs"></div>

    <fieldset class="adv">
      <legend>Advanced settings</legend>
      <div class="advgrid">
        <label>LLM server
          <select id="llm-preset">
            <option value="http://localhost:8110">Gemma 4 26B-A4B (:8110)</option>
            <option value="http://localhost:8080">Qwen3.6 35B-A3B (:8080)</option>
            <option value="http://localhost:8111">Qwen3.6 35B-A3B MTP (:8111)</option>
            <option value="custom">Custom…</option>
          </select>
        </label>
        <label>LLM base URL <input type="text" id="llm-url" value="http://localhost:8110"></label>
        <label>Series title <input type="text" id="series-title" placeholder="e.g. Sekai Saikou no Ansatsusha"></label>
        <label>Tags <input type="text" id="series-tags" placeholder="Action, Fantasy, Comedy…"></label>
        <label class="full">Description
          <textarea id="series-desc" rows="3" placeholder="One-paragraph plot summary — helps tone and character voices"></textarea>
        </label>
        <label class="full">Custom names map
          <small class="note">one <code>jp=English</code> per line, or comma-separated</small>
          <textarea id="custom-map" rows="4" placeholder="ルーグ=Lugh&#10;トウアハーデ=Tuatha Dé&#10;ディア=Dia"></textarea>
        </label>
        <label>Batch size (pages translated together)
          <input type="number" id="batch-size" value="4" min="1" max="16">
        </label>
        <label>Detection confidence (lower = more bubbles)
          <input type="number" id="conf" value="0.15" min="0.05" max="0.9" step="0.05">
        </label>
        <label>Lettering size (1.0 = default, lower = smaller)
          <input type="number" id="font-scale" value="1.0" min="0.5" max="1.0" step="0.05">
        </label>
        <label class="check"><input type="checkbox" id="keep-honorifics"> Keep honorifics (-san, -chan…)</label>
        <label class="check"><input type="checkbox" id="save-comparisons" checked> Show comparison sheet (Original / Translated / Translated + LaMa)</label>
      </div>
    </fieldset>

    <div style="margin-top: 6px;">
      <button id="translate-btn" disabled>Translate</button>
      <span id="global-status" class="note"></span>
    </div>
  </fieldset>

  <div id="results"></div>
</div>

<script>
(function () {
  var items = [];   // [{ file: File, url: objectURL }]
  var $ = function (id) { return document.getElementById(id); };
  var fileInput = $("file-input"), thumbs = $("thumbs"), button = $("translate-btn");
  var globalStatus = $("global-status"), results = $("results"), dropzone = $("dropzone");
  var timer = null;
  var busy = false;
  var holdStatusUntil = 0;  // keep the last result message visible

  // ---------- status banner ----------
  function refreshStatus() {
    if (busy || Date.now() < holdStatusUntil) return;
    fetch("/status").then(function (r) { return r.json(); }).then(function (s) {
      var parts = [];
      parts.push(s.models_loaded ? "models loaded" : "models NOT loaded" + (s.load_error ? " — " + s.load_error : ""));
      parts.push("LLM (" + s.llm_base_url + "): " + s.llm_state);
      globalStatus.textContent = "[" + parts.join(" | ") + "]";
      globalStatus.style.color = (s.models_loaded && s.llm_state === "ready") ? "#b5bd68" : "#f0c674";
    }).catch(function () {
      globalStatus.textContent = "[server unreachable]";
      globalStatus.style.color = "#cc6666";
    });
  }
  refreshStatus();
  setInterval(refreshStatus, 15000);

  // ---------- upload queue (thumbnails with controls) ----------
  function renderFiles() {
    holdStatusUntil = 0;  // any queue change resumes the live status feed
    thumbs.innerHTML = "";
    items.forEach(function (it, i) {
      var t = document.createElement("div");
      t.className = "thumb";
      t.draggable = true;
      t.dataset.index = i;

      var img = document.createElement("img");
      img.className = "pic";
      img.src = it.url;
      img.alt = it.file.name;
      t.appendChild(img);

      var num = document.createElement("span");
      num.className = "num";
      num.textContent = i + 1;
      t.appendChild(num);

      var name = document.createElement("div");
      name.className = "fname";
      name.textContent = it.file.name;
      name.title = it.file.name;
      t.appendChild(name);

      var meta = document.createElement("div");
      meta.className = "fmeta";
      meta.innerHTML = "<span>" + (it.file.size / 1024).toFixed(0) + " KB</span>" +
                       '<span class="st queued" id="st-' + i + '">\u25A0 queued</span>';
      t.appendChild(meta);

      var ctl = document.createElement("div");
      ctl.className = "fctl";
      ctl.innerHTML =
        '<button type="button" class="mv" title="Move left" ' + (i === 0 ? "disabled" : "") + '>&#9664;</button>' +
        '<button type="button" class="mv" title="Move right" ' + (i === items.length - 1 ? "disabled" : "") + '>&#9654;</button>' +
        '<button type="button" class="rm" title="Remove">&#10005;</button>';
      ctl.children[0].addEventListener("click", function () { move(i, -1); });
      ctl.children[1].addEventListener("click", function () { move(i, 1); });
      ctl.children[2].addEventListener("click", function () { remove(i); });
      t.appendChild(ctl);

      // drag & drop reorder
      t.addEventListener("dragstart", function (e) {
        dragFrom = i;
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", String(i));
      });
      t.addEventListener("dragover", function (e) {
        e.preventDefault();
        t.classList.add("dragover");
      });
      t.addEventListener("dragleave", function () { t.classList.remove("dragover"); });
      t.addEventListener("drop", function (e) {
        e.preventDefault();
        e.stopPropagation();
        t.classList.remove("dragover");
        var from = Number(e.dataTransfer.getData("text/plain"));
        if (isNaN(from) || from === i) return;
        var moved = items.splice(from, 1)[0];
        items.splice(i, 0, moved);
        renderFiles();
      });

      thumbs.appendChild(t);
    });
    $("queue-note").textContent = items.length
      ? items.length + (items.length === 1 ? " page" : " pages") + " queued — reorder with \u25C0 \u25B6 or drag \u00B7 \u2715 removes"
      : "";
    button.disabled = items.length === 0;
  }

  var dragFrom = null;

  function move(i, delta) {
    var j = i + delta;
    if (j < 0 || j >= items.length) return;
    var tmp = items[i]; items[i] = items[j]; items[j] = tmp;
    renderFiles();
  }

  function remove(i) {
    if (items[i]) URL.revokeObjectURL(items[i].url);
    items.splice(i, 1);
    renderFiles();
  }

  function uniqueName(name) {
    var dup = items.some(function (it) { return it.file.name === name; });
    if (!dup) return name;
    var dot = name.lastIndexOf(".");
    var base = dot > 0 ? name.slice(0, dot) : name;
    var ext = dot > 0 ? name.slice(dot) : "";
    var n = 2;
    while (items.some(function (it) { return it.file.name === base + "_" + n + ext; })) n++;
    return base + "_" + n + ext;
  }

  function addFiles(list) {
    Array.prototype.slice.call(list).forEach(function (f) {
      if (!f || !(f.type.indexOf("image/") === 0 || /\.(png|jpe?g|webp|bmp)$/i.test(f.name))) return;
      var name = uniqueName(f.name || ("pasted_" + Date.now() + ".png"));
      var file = (name !== f.name) ? new File([f], name, { type: f.type }) : f;
      items.push({ file: file, url: URL.createObjectURL(file) });
    });
    renderFiles();
  }

  dropzone.addEventListener("click", function () { fileInput.click(); });
  dropzone.addEventListener("dragover", function (e) { e.preventDefault(); dropzone.classList.add("drag"); });
  dropzone.addEventListener("dragleave", function () { dropzone.classList.remove("drag"); });
  dropzone.addEventListener("drop", function (e) {
    e.preventDefault();
    dropzone.classList.remove("drag");
    if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener("change", function () { addFiles(fileInput.files); fileInput.value = ""; });

  // Ctrl+V paste anywhere on the page
  document.addEventListener("paste", function (e) {
    var list = (e.clipboardData && e.clipboardData.items) || [];
    var imgs = [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].kind === "file" && list[i].type.indexOf("image/") === 0) {
        var f = list[i].getAsFile();
        if (f) imgs.push(f);
      }
    }
    if (imgs.length) {
      e.preventDefault();
      addFiles(imgs);
    }
  });

  // Dropping files outside the dropzone must not navigate the page away
  window.addEventListener("dragover", function (e) { e.preventDefault(); });
  window.addEventListener("drop", function (e) { e.preventDefault(); });

  function setStatus(i, cls, text) {
    var st = $("st-" + i);
    if (!st) return;
    st.className = "st " + cls;
    st.textContent = text ? "\u25A0 " + text : "";
  }

  // ---------- advanced settings persistence ----------
  var fields = ["llm-preset", "llm-url", "series-title", "series-tags", "series-desc",
                "custom-map", "batch-size", "conf", "font-scale", "keep-honorifics", "save-comparisons"];
  function saveSettings() {
    var data = {};
    fields.forEach(function (id) {
      var el = $(id);
      data[id] = el.type === "checkbox" ? el.checked : el.value;
    });
    localStorage.setItem("manga-settings", JSON.stringify(data));
  }
  function loadSettings() {
    var raw = localStorage.getItem("manga-settings");
    if (!raw) return;
    try {
      var data = JSON.parse(raw);
      fields.forEach(function (id) {
        var el = $(id);
        if (!(id in data)) return;
        if (el.type === "checkbox") el.checked = data[id]; else el.value = data[id];
      });
    } catch (e) { /* ignore corrupt settings */ }
  }
  loadSettings();
  fields.forEach(function (id) { $(id).addEventListener("change", saveSettings); });

  $("llm-preset").addEventListener("change", function () {
    if (this.value !== "custom") $("llm-url").value = this.value;
    saveSettings();
  });

  // ---------- translate ----------
  function fmtTime(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function postNumber(i) {
    return 13000000 + (Math.floor(Date.now() / 100000) % 800000) + i;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function makePost(page, index) {
    var post = document.createElement("div");
    post.className = "reply";

    var info = document.createElement("div");
    info.className = "postInfo";
    var now = new Date();
    var pad = function (n) { return (n < 10 ? "0" : "") + n; };
    info.innerHTML = '<span class="name">Translator</span>' +
      '  ' + pad(now.getMonth() + 1) + "/" + pad(now.getDate()) + "/" + (now.getFullYear() % 100) + ' ' +
      '<span class="subject">' + escapeHtml(page.filename) + '</span> ' +
      '<span class="postNum">No.' + postNumber(index) + '</span>';
    post.appendChild(info);

    if (page.error) {
      var err = document.createElement("div");
      err.className = "err";
      err.textContent = page.error;
      post.appendChild(err);
      return post;
    }

    var img = document.createElement("img");
    img.className = "result";
    img.alt = page.filename;
    img.src = page.comparison_b64
      ? "data:image/png;base64," + page.comparison_b64
      : "data:image/jpeg;base64," + page.translated_b64;
    post.appendChild(img);

    var fileLine = document.createElement("div");
    fileLine.className = "fileText";
    fileLine.textContent = "File: " + page.filename + " (translated" +
      (page.comparison_b64 ? " + comparison sheet" : "") + ")";
    post.appendChild(fileLine);

    var dl = document.createElement("div");
    dl.className = "dl";
    var links = [];
    if (page.translated_b64) {
      links.push(['data:image/jpeg;base64,' + page.translated_b64, "translated_" + page.filename]);
    }
    if (page.comparison_b64) {
      links.push(['data:image/png;base64,' + page.comparison_b64,
                  page.filename.replace(/\.[^.]+$/, "") + "_comparison.png"]);
    }
    links.forEach(function (l) {
      var a = document.createElement("a");
      a.href = l[0];
      a.download = l[1];
      a.textContent = "Download " + l[1];
      a.className = "dlink";
      dl.appendChild(a);
    });
    post.appendChild(dl);
    return post;
  }

  button.addEventListener("click", function () {
    if (!items.length) return;
    var fd = new FormData();
    items.forEach(function (it) { fd.append("files", it.file, it.file.name); });
    fd.append("title", $("series-title").value);
    fd.append("tags", $("series-tags").value);
    fd.append("description", $("series-desc").value);
    fd.append("custom_translations", $("custom-map").value);
    fd.append("keep_honorifics", $("keep-honorifics").checked ? "true" : "false");
    fd.append("conf_threshold", $("conf").value);
    fd.append("batch_size", $("batch-size").value);
    fd.append("font_scale", $("font-scale").value);
    fd.append("save_comparisons", $("save-comparisons").checked ? "true" : "false");
    fd.append("llm_base_url", $("llm-url").value.trim());

    items.forEach(function (it, i) { setStatus(i, "processing", "processing…"); });
    button.disabled = true;
    busy = true;
    holdStatusUntil = 0;
    results.innerHTML = "";

    var started = Date.now();
    globalStatus.textContent = "Translating " + items.length + " page(s) — 0:00 elapsed";
    globalStatus.style.color = "#f0c674";
    timer = setInterval(function () {
      globalStatus.textContent = "Translating " + items.length + " page(s) — " +
        fmtTime(Math.floor((Date.now() - started) / 1000)) + " elapsed";
    }, 1000);

    fetch("/translate", { method: "POST", body: fd })
      .then(function (r) {
        return r.json().then(function (body) {
          if (!r.ok) throw new Error(body.detail || ("HTTP " + r.status));
          return body;
        });
      })
      .then(function (body) {
        clearInterval(timer);
        body.pages.forEach(function (page, i) {
          setStatus(i, page.error ? "error" : "done", page.error ? "error" : "done");
          results.appendChild(makePost(page, i));
        });
        var ok = body.pages.filter(function (p) { return !p.error; }).length;
        globalStatus.textContent = "Done — " + ok + "/" + body.pages.length + " page(s) translated in " +
          fmtTime(Math.floor((Date.now() - started) / 1000)) + ".";
        globalStatus.style.color = "#b5bd68";
        holdStatusUntil = Date.now() + 5 * 60 * 1000;
        button.disabled = false;
        busy = false;
      })
      .catch(function (err) {
        clearInterval(timer);
        items.forEach(function (it, i) { setStatus(i, "error", "failed"); });
        globalStatus.textContent = "Error: " + err.message;
        globalStatus.style.color = "#cc6666";
        holdStatusUntil = Date.now() + 5 * 60 * 1000;
        button.disabled = false;
        busy = false;
      });
  });
})();
</script>
</body>
</html>
